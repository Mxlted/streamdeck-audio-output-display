<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src ws://127.0.0.1:*"
    />
    <title>Default Audio Device</title>
    <link rel="stylesheet" href="property-inspector.css" />
    <script defer src="pi-connection.js"></script>
    <script defer src="audio-device.js"></script>
</head>
<body>
    <main>
        <label class="field-row" for="customLabel">
            <span>Custom label</span>
            <input id="customLabel" type="text" maxlength="40" placeholder="Auto-detect" />
        </label>

        <label class="field-row" for="nameStyle">
            <span>Show</span>
            <select id="nameStyle">
                <option value="role">Role (Speakers)</option>
                <option value="model">Model (Realtek Audio)</option>
                <option value="full">Both</option>
            </select>
        </label>

        <label class="field-row" for="maxLength">
            <span>Max chars</span>
            <span class="range-control">
                <input id="maxLength" type="range" min="6" max="40" step="1" value="22" />
                <output id="maxLengthValue" for="maxLength">22</output>
            </span>
        </label>

        <label class="field-row" for="aggressiveShorten">
            <span>Shorten</span>
            <span class="checkbox-control">
                <input id="aggressiveShorten" type="checkbox" checked />
                <span>Strip driver noise</span>
            </span>
        </label>

        <p class="hint">Press the Stream Deck key to force a fresh device read.</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
