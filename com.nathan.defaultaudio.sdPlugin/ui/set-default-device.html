<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Set Default Audio Device</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            padding: 12px;
            background: #2d2d2d;
            color: #d8d8d8;
            font-size: 12px;
        }

        label {
            display: grid;
            grid-template-columns: 86px minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }

        select {
            width: 100%;
            min-width: 0;
            height: 28px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #1f1f1f;
            color: #f2f2f2;
            padding: 0 8px;
            font: inherit;
        }
    </style>
</head>
<body>
    <label>
        <span>Device</span>
        <select id="deviceSelect" disabled>
            <option>Loading devices...</option>
        </select>
    </label>

    <script>
        const select = document.getElementById("deviceSelect");
        let websocket;
        let uuid;
        let action;
        let settings = {};
        let devices = [];

        window.connectElgatoStreamDeckSocket = (
            port,
            propertyInspectorUUID,
            registerEvent,
            _info,
            actionInfo,
        ) => {
            uuid = propertyInspectorUUID;
            const parsedActionInfo = JSON.parse(actionInfo);
            action = parsedActionInfo.action;
            settings = parsedActionInfo.payload?.settings ?? {};

            websocket = new WebSocket(`ws://127.0.0.1:${port}`);
            websocket.onopen = () => {
                send({ event: registerEvent, uuid });
                send({ event: "getSettings", action, context: uuid });
                requestDevices();
            };
            websocket.onmessage = (event) => handleMessage(JSON.parse(event.data));
        };

        select.addEventListener("focus", requestDevices);
        select.addEventListener("change", () => {
            const option = select.selectedOptions[0];
            if (!option || !option.value) return;

            settings = {
                ...settings,
                selectedDeviceId: option.value,
                selectedDeviceName: option.dataset.name || "",
            };

            send({
                event: "setSettings",
                action,
                context: uuid,
                payload: settings,
            });
        });

        function requestDevices() {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
            send({
                event: "sendToPlugin",
                action,
                context: uuid,
                payload: { type: "list-devices" },
            });
        }

        function handleMessage(message) {
            if (message.event === "didReceiveSettings") {
                settings = message.payload?.settings ?? {};
                renderDevices();
                return;
            }

            if (message.event !== "sendToPropertyInspector") return;
            const payload = message.payload;

            if (payload?.type === "device-list") {
                devices = Array.isArray(payload.devices) ? payload.devices : [];
                renderDevices();
            } else if (payload?.type === "device-list-error") {
                select.disabled = true;
                select.replaceChildren(new Option(payload.message || "Unable to load devices", ""));
            }
        }

        function renderDevices() {
            select.replaceChildren();

            if (devices.length === 0) {
                select.disabled = true;
                select.append(new Option("No devices found", ""));
                return;
            }

            const selectedId = settings.selectedDeviceId || settings.fallbackDeviceId || "";
            const selectedName = settings.selectedDeviceName || settings.targetName || "";
            const nameCounts = devices.reduce((counts, device) => {
                counts.set(device.name, (counts.get(device.name) || 0) + 1);
                return counts;
            }, new Map());
            const nameIndexes = new Map();
            let matchedSelection = false;

            select.disabled = false;
            select.append(new Option("Choose a device", ""));

            for (const device of devices) {
                const duplicateCount = nameCounts.get(device.name) || 0;
                const nextIndex = (nameIndexes.get(device.name) || 0) + 1;
                nameIndexes.set(device.name, nextIndex);

                const label =
                    duplicateCount > 1 ? `${device.name} #${nextIndex}` : device.name;
                const option = new Option(label, device.id);
                option.dataset.name = device.name;

                if (
                    device.id === selectedId ||
                    (!selectedId && selectedName && device.name === selectedName)
                ) {
                    option.selected = true;
                    matchedSelection = true;
                }

                select.append(option);
            }

            if (!matchedSelection) {
                select.value = "";
            }
        }

        function send(message) {
            websocket?.send(JSON.stringify(message));
        }
    </script>
</body>
</html>
