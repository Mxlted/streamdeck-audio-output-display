<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src ws://127.0.0.1:*"
    />
    <title>Set Default Audio Device</title>
    <link rel="stylesheet" href="property-inspector.css" />
    <script defer src="pi-connection.js"></script>
    <script defer src="set-default-device.js"></script>
</head>
<body>
    <main>
        <label class="field-row" for="deviceSelect">
            <span>Device</span>
            <select id="deviceSelect" disabled>
                <option value="">Loading devices…</option>
            </select>
        </label>

        <div class="button-row">
            <button id="refreshDevices" type="button" disabled>Refresh devices</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">Connecting…</p>
    </main>
</body>
</html>
